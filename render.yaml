services:
  - type: web
    name: neko-api
    runtime: python
    plan: starter # Persistent disk requires a paid Render web service.
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: neko-user-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: openai/gpt-oss-20b
      - key: NEKO_DB_PATH
        value: /var/data/neko.sqlite3
      - key: ALLOW_ORIGINS
        sync: false
